# 零配置：宿主只需启用插件，不必引用本文件。
# 首次启动自动完成：
#   - data_dir/key-peppers（pepper）
#   - caller=default（仅作为 Key 归属与用量归类，不设置账户额度）
#   - 价格规则 bootstrap-all-models：regexp ".*"，费用 0
#   - 不自动创建 API Key；请通过侧栏或管理 API 手动签发，并为每个 Key 设置额度
#
# 需要覆盖默认时，在宿主 plugins.items.credit-manager.config 写：
#   config_file: /绝对路径/config.example.yaml
# 或设环境变量 CREDIT_MANAGER_CONFIG_FILE。宿主内联字段会覆盖文件；嵌套 config_file 会被忽略。

# data_dir: ./data/credit-manager
# database_file: credit-manager.db
# busy_timeout: 5s

keys:
  pepper_env: CREDIT_MANAGER_KEY_PEPPERS
  pepper_file: key-peppers
  active_pepper_id: active

limits:
  max_token_estimate: 1000000
  default_output_reserve: 4096
  require_estimate: false

pricing:
  # 零配置默认 allow；生产可改 deny 并配置真实价格规则
  unknown_policy: allow

settlement:
  missing_usage: settle_reserved

stream:
  max_buffer_bytes: 4194304