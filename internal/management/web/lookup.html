<!doctype html>
<html lang="zh-CN" data-theme="auto" data-palette="white">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Key 自助查询</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<link rel="stylesheet" href="./lookup.css">
</head>
<body>
<main>
  <header class="topbar"><div><div class="brand">Credit Manager</div><h1>Key 额度与使用统计</h1></div><div class="display-controls"><div class="pref-switch" role="group" aria-label="语言与主题"><div class="pref-menu" id="langMenu"><button type="button" class="pref-btn" id="langBtn" aria-label="语言" title="语言" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3.2 2.8 14.8 0 18M12 3C9.2 6.2 9.2 17.8 12 21"/></svg></button><div class="pref-panel" id="langPanel" hidden><button type="button" data-locale="zh-CN" data-no-i18n>简体中文</button><button type="button" data-locale="zh-TW" data-no-i18n>繁體中文</button><button type="button" data-locale="en" data-no-i18n>English</button><button type="button" data-locale="ru" data-no-i18n>Русский</button></div></div><div class="pref-menu" id="themeMenu"><button type="button" class="pref-btn" id="themeBtn" aria-label="主题" title="主题" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><div class="pref-panel" id="themePanel" hidden><button type="button" data-theme-value="auto">跟随系统</button><button type="button" data-theme-value="white">纯白</button><button type="button" data-theme-value="light">羊毛纸</button><button type="button" data-theme-value="dark">暗色</button></div></div></div><div class="unit-switch" id="tokenUnitSwitch" role="group" aria-label="Token 显示单位"><span>Token</span><button type="button" data-token-unit="raw" title="原始数量">个</button><button type="button" data-token-unit="qian" title="千 (×1,000)">千</button><button type="button" data-token-unit="k" title="k (×1,000)">k</button><button type="button" data-token-unit="wan" title="万 (×10,000)">万</button><button type="button" data-token-unit="w" title="w (×10,000)">w</button><button type="button" data-token-unit="baiwan" title="百万 (×1,000,000)">百万</button><button type="button" data-token-unit="m" title="m (×1,000,000)">m</button></div><div class="unit-switch" id="currencySwitch" role="group" aria-label="费用显示货币"><span>费用</span><button type="button" data-currency="USD">USD</button><button type="button" data-currency="CNY">CNY</button></div><span class="rate-field hidden" id="usdCnyRateField" title="实时美元兑人民币汇率">1 USD = <b id="usdCnyRate" data-no-i18n>—</b> CNY</span><p>输入 Key 后仅可查看该 Key 自身的数据</p></div></header>
  <form class="lookup" id="lookupForm"><input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴 tk- 开头的 Key" aria-label="插件 Key" required/><button id="submit" type="submit">查询</button></form>
  <p class="privacy">Key 仅用于本次请求，不会保存到页面、浏览器或地址栏。</p><div id="error" class="error hidden" role="alert"></div>
  <section id="dashboard" class="dashboard hidden">
    <div class="key-head"><h2 id="keyLabel">Key 概览</h2><span id="fingerprint" class="fingerprint"></span></div>
    <div class="section"><div class="section-head"><h3>额度使用</h3><span>含当前在途预占</span></div><div id="quotas" class="quota-grid"></div></div>
    <div id="modelTokenLimitsSection" class="section hidden"><div class="section-head"><h3>模型 Token 限制</h3><span id="modelTokenLimitsState">含当前在途预占</span></div><div id="modelTokenLimits" class="quota-grid"></div></div>
    <div class="section"><div class="section-head"><h3>使用统计</h3></div><div class="filter-panel"><div class="filter-bar"><select id="range" aria-label="时间范围"><option value="today" selected>今日</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="90">最近 90 天</option><option value="custom">自定义范围</option><option value="all">全部时间</option></select><div id="customRange" class="custom-range hidden"><span class="date-field" id="fromField"><input id="from" type="date" aria-label="开始时间（UTC）" title="开始时间（UTC）"/><span class="date-placeholder">开始时间</span></span><span class="date-field" id="toField"><input id="to" type="date" aria-label="结束时间（UTC）" title="结束时间（UTC）"/><span class="date-placeholder">结束时间</span></span></div><select id="model" aria-label="模型"><option value="">全部模型</option></select><button id="refresh" type="button">刷新统计</button></div></div><div id="stats" class="stats"></div></div>
    <div class="section"><div class="analytics"><div class="trend-stack"><div class="chart-card"><div class="section-head"><h3>Token 趋势</h3><div class="metric-switch trend-grain-switch" data-trend-chart="token" role="group" aria-label="Token 趋势时间维度"><button type="button" data-trend-grain="hour" class="active">时</button><button type="button" data-trend-grain="day">日</button><button type="button" data-trend-grain="month">月</button></div></div><div id="tokenTrendTotal" class="trend-metric-row"></div><div id="tokenTrend" class="chart" aria-label="Token 趋势图"></div></div><div class="chart-card"><div class="section-head"><h3>费用趋势</h3><div class="metric-switch trend-grain-switch" data-trend-chart="cost" role="group" aria-label="费用趋势时间维度"><button type="button" data-trend-grain="hour" class="active">时</button><button type="button" data-trend-grain="day">日</button><button type="button" data-trend-grain="month">月</button></div></div><div id="costTrendTotal" class="trend-metric-row"></div><div id="costTrend" class="chart" aria-label="费用趋势图"></div></div></div><div class="chart-card share-card"><div class="section-head"><h3>模型调用占比</h3><div class="metric-switch" id="modelMetric"><button type="button" data-metric="requests" class="active">调用次数</button><button type="button" data-metric="tokens">Token</button><button type="button" data-metric="cost">费用</button></div></div><div class="share-body"><div id="modelShare" class="chart" aria-label="模型调用占比图"></div><div id="modelShareLegend" class="share-legend"></div></div></div><div class="chart-card rank-card"><div class="section-head"><h3>模型效率排行</h3><div class="metric-switch" id="modelRankMetric" role="group" aria-label="模型效率指标"><button type="button" data-rank-metric="value" class="active">性价比</button><button type="button" data-rank-metric="unit">单次</button><button type="button" data-rank-metric="cache">缓存</button><button type="button" data-rank-metric="tps">吞吐</button></div></div><p class="rank-hint" id="modelRankHint">按每美元产出 Token 排序，越高越省</p><div id="modelRank" class="model-rank-list"></div></div></div></div>
    <div class="section"><div class="section-head"><h3>最近调用</h3><span id="recentState">—</span></div><div id="recent" class="table-wrap"></div><div id="recentPagination" class="recent-pagination"></div></div>
  </section>
</main>
<script src="./lookup.js" defer></script>
</body>
</html>
